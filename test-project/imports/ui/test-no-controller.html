<template name="parentWithController">
  {{!--
    @template parentWithController
    @description A parent template that passes parameters to a child template without its own controller.
    @param {string} userName - The name of the user.
    @param {number} age - The age of the user.
    @param {boolean} isActive - Indicates if the user is active.
    @param {AddressType} address - The address object containing street, city, state, and zip.
   --}}
  <div>
    {{> childWithoutController
      userName=userName
      userAge=age
      isActive=isActive
      address=address
    }}
  </div>
</template>

<template name="childWithoutController">
  {{!--
    @template childWithoutController
    @description A child template that does not have its own controller.
    @param {string} userName - The name of the user.
    @param {number} userAge - The age of the user.
    @param {boolean} isActive - Indicates if the user is active.
    @param {AddressType} address - The address object containing street, city, state, and zip.
    @param {{ url: string; altText?: string }[]} images - An array of image objects with url and altText
    @param {{ title: string, description: string }[]} thing - An array of thing objects with title and description.
    @param {string} anotherThing - test
  --}}
  <div class="user-card">
    <h2>{{userName}}</h2>
    <p>Age: {{userAge}}</p>
    <p>Active: {{this.isActive}}</p>
    <p>Formatted: {{formatText userDescription}}</p>


    {{#if isActive}}
      <p>The user is active.</p>
    {{else}}
      <p>The user is not active.</p>
    {{/if}}
    {{#each image in images}}
      <img src="{{image.url}}"
        alt="{{image.altText}}" />
      {{firstName}} - {{image.name}}
    {{/each}}
    {{#each thing}}
      <div class="thing-item">
        <h3>{{thing.title}}</h3>
        <p>{{thing.description}}</p>
      </div>
    {{/each}}
    {{#with address}}
      <div class="address">
        {{firstName}}
        <p>{{street}}, {{city}}, {{state}} {{zip}}</p>
      </div>
    {{/with}}
  </div>
</template>
